<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none">
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1280" height="440" rx="28" />
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1d24" />
      <stop offset="55%" stop-color="#191a21" />
      <stop offset="100%" stop-color="#14151c" />
    </linearGradient>
    <radialGradient id="glowSage" cx="1040" cy="195" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6fa892" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6fa892" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#6fa892" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCoral" cx="930" cy="310" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef5b5b" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#ef5b5b" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ef5b5b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1280" height="440" fill="url(#bg)" />
    <rect width="1280" height="440" fill="url(#glowSage)" />
    <rect width="1280" height="440" fill="url(#glowCoral)" />

    <!-- Subtle architectural grid lines -->
    <line x1="824" y1="36" x2="824" y2="404" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <line x1="68" y1="354" x2="790" y2="354" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Subtle crosshair registration marks -->
    <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
      <path d="M726 56 v12 M720 62 h12" />
      <path d="M792 316 v12 M786 322 h12" />
      <path d="M1208 66 v10 M1203 71 h10" />
    </g>

    <!-- Top kicker -->
    <text x="68" y="80" fill="#ef5b5b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="3">— DAILY-NOTE SPIRAL PLANNER</text>

    <!-- Main display wordmark -->
    <text x="64" y="172" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.8">NAUTILUS SPIRAL</text>
    <rect x="668" y="154" width="20" height="18" rx="2" fill="#ef5b5b" />

    <!-- Tagline -->
    <text x="68" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.4">
      <tspan fill="#ffffff">Write your daily note. </tspan><tspan fill="#ef5b5b">Give every minute a job.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="68" y="280" fill="#9ea4b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400">A 12-hour spiral day planner &amp; Pomodoro timer driven straight from your Obsidian daily note.</text>
    <text x="68" y="308" fill="#9ea4b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400">Pin fixed events, flow to-dos into free gaps, and visualize AI agent sessions on the inner rings.</text>

    <!-- Bottom metadata strip -->
    <text x="68" y="388" fill="#777d8c" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.4">· 12H SPIRAL DIAL   · AUTO-SCHEDULE   · POMODORO   · AGENT DECK SYNC   · MIT</text>

    <!-- Right side: minimalist geometric Nautilus Spiral dial -->
    <g transform="translate(1038, 198)">
      <!-- Subtle outer rail & ticks -->
      <circle r="134" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      <circle r="112" stroke="#ffffff" stroke-opacity="0.08" stroke-width="12" />
      <circle r="84" stroke="#ffffff" stroke-opacity="0.06" stroke-width="10" />
      <circle r="58" stroke="#ffffff" stroke-opacity="0.05" stroke-width="7" />

      <!-- Outer ring: Fixed event (violet) + scheduled to-dos (sage) -->
      <path d="M 0 -112 A 112 112 0 0 1 97 -56" stroke="#948ac0" stroke-width="12" stroke-linecap="round" />
      <path d="M 106 -36 A 112 112 0 0 1 82 76" stroke="#76b394" stroke-width="12" stroke-linecap="round" />
      <path d="M 60 94 A 112 112 0 0 1 -58 96" stroke="#5b967c" stroke-width="12" stroke-linecap="round" stroke-opacity="0.72" />

      <!-- Outer rail: Pomodoro solid elapsed + dashed reservation -->
      <path d="M -88 -96 A 130 130 0 0 1 -20 -128" stroke="#ef5b5b" stroke-width="4" stroke-linecap="round" />
      <path d="M -10 -129 A 130 130 0 0 1 48 -120" stroke="#ef5b5b" stroke-width="3.5" stroke-dasharray="6 6" stroke-linecap="round" stroke-opacity="0.8" />
      <circle cx="52" cy="-119" r="4.5" fill="#181920" stroke="#ef5b5b" stroke-width="2.5" />

      <!-- Middle ring: Afternoon blocks -->
      <path d="M -78 -30 A 84 84 0 0 1 26 -80" stroke="#d4a472" stroke-width="10" stroke-linecap="round" />
      <path d="M 48 -68 A 84 84 0 0 1 82 18" stroke="#76b394" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8" />

      <!-- Inner ring: Agent Deck live spans -->
      <path d="M -46 -35 A 58 58 0 0 1 40 -42" stroke="#948ac0" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 52 -24 A 58 58 0 0 1 28 50" stroke="#ef5b5b" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.85" />

      <!-- Now pointer -->
      <line x1="0" y1="0" x2="72" y2="-86" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="72" cy="-86" r="4.5" fill="#ffffff" />

      <!-- Center readout -->
      <circle r="34" fill="#181921" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="0" y="4" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">14:30</text>
      <text x="0" y="19" fill="#85a993" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="1" text-anchor="middle">SPARE 1.5H</text>
    </g>

    <!-- Status pill -->
    <rect x="932" y="362" width="212" height="32" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />
    <circle cx="951" cy="378" r="3.5" fill="#76b394" />
    <text x="964" y="382" fill="#d0d5e0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">NAUTILUS SPIRAL // READY</text>

    <!-- Far right vertical micro-label -->
    <text x="1252" y="220" fill="#ffffff" fill-opacity="0.18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="2.4" text-anchor="middle" transform="rotate(-90 1252 220)">OBSIDIAN PLUGIN · DAILY-NOTE DRIVEN</text>
  </g>
</svg>
