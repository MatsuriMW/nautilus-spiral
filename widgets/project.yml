# 螺旋日程的 macOS 小组件。用 XcodeGen 生成工程：./build.sh 会生成、编译、装进 ~/Applications
name: NautilusWidgets
options:
  bundleIdPrefix: site.matsuri
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 本机签名就够：开发者证书（免费账号也有）签，不需要描述文件。团队号由 build.sh 从钥匙串里的证书读出来传进来
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
targets:
  NautilusWidgets:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: NautilusWidgetsExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 螺旋日程小组件
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: nautilus-widgets
            CFBundleURLSchemes: [nautilus-widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.matsuri.nautilus-widgets
  NautilusWidgetsExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    # 小组件必须在沙盒里跑；数据文件在沙盒外，单开这一个文件夹（要往 inbox/ 里写点了什么，所以是可读写）
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Nautilus Spiral/
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 螺旋日程
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.matsuri.nautilus-widgets.widgets
